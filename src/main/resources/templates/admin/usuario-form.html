<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expedição Dinossauros | Credenciamento de Explorador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    
    <style>
        body {
            background: linear-gradient(rgba(26, 21, 17, 0.85), rgba(15, 35, 26, 0.9)), 
                        url('/img/explorer.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #FAEDCD;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-card {
            background: rgba(43, 37, 31, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 163, 115, 0.3);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 550px;
        }

        .bg-dark-paleo {
            background-color: #2B251F !important;
            color: #FFFFFF !important; 
            border: 1px solid #D4A373 !important;
        }
        
        .bg-dark-paleo::placeholder {
            color: #D4A373 !important; 
            opacity: 0.8 !important;
        }
        
        .bg-dark-paleo:focus {
            background-color: #1A3A2A !important;
            color: #FFFFFF !important; 
            border-color: #FAEDCD !important;
            box-shadow: 0 0 10px rgba(212, 163, 115, 0.4);
        }

        .bg-dark-paleo option {
            background-color: #2B251F !important;
            color: #FAEDCD !important;
        }

        .btn-custom-primary { background-color: #D4A373; color: #2B251F; font-weight: bold; border: none; }
        .btn-custom-primary:hover { background-color: #FAEDCD; color: #1A3A2A; transform: scale(1.02); }

        .btn-custom-cancel { background: transparent; color: #E6E1DA; border: 1px solid rgba(230, 225, 218, 0.4); }
        .btn-custom-cancel:hover { background: rgba(158, 42, 43, 0.3); color: #ffffff; border-color: #9E2A2B; }

        .header-img { width: 90px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="container p-3 d-flex justify-content-center">
        <div class="glass-card p-4 p-md-5">
            
            <div class="text-center mb-4">
                <img th:src="@{/img/placapara.png}" src="/img/placapara.png" class="header-img" alt="Logo">
                <h3 class="text-uppercase fw-bold m-0" style="color: #FAEDCD;">Credenciamento</h3>
                <p class="text-white-50 small">Gerenciamento de registros na Reserva Paleontológica.</p>
            </div>
            
            <form th:action="@{/admin/usuarios/salvar}" th:object="${usuario}" method="POST">
                <input type="hidden" th:field="*{id}">
                
                <div class="mb-3">
                    <label class="form-label fw-bold small text-uppercase" style="color: #D4A373;">Nome Completo</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark-paleo text-white-50"><i class="bi bi-person-fill"></i></span>
                        <input type="text" th:field="*{nome}" class="form-control bg-dark-paleo" required placeholder="Nome do Explorador">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small text-uppercase" style="color: #D4A373;">Login de Acesso</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark-paleo text-white-50"><i class="bi bi-at"></i></span>
                        <input type="text" th:field="*{login}" class="form-control bg-dark-paleo" required placeholder="Codinome de login">
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold small text-uppercase" style="color: #D4A373;">Senha de Segurança</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark-paleo text-white-50"><i class="bi bi-key-fill"></i></span>
                        <input type="password" th:field="*{senha}" class="form-control bg-dark-paleo" placeholder="Em branco para gerar padrão (123456)">
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-bold small text-uppercase" style="color: #D4A373;">Nível de Acesso</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark-paleo text-white-50"><i class="bi bi-sliders"></i></span>
                        <select th:field="*{perfil}" class="form-select bg-dark-paleo" style="color: #FAEDCD !important;">
                            <option value="ADMIN">Administrador / Comando Central</option>
                            <option value="AUTOR">Autor / Paleontólogo de Campo</option>
                            <option value="COLECIONADOR">Colecionador / Ranger Residente</option>
                        </select>
                    </div>
                </div>
                
                <div class="d-flex justify-content-end gap-3 mt-4">
                    <a th:href="@{/admin/dashboard}" class="btn btn-custom-cancel px-4 py-2 rounded-3 text-uppercase small fw-bold">
                        Abortar
                    </a>
                    <button type="submit" class="btn btn-custom-primary px-4 py-2 rounded-3 text-uppercase small">
                        <i class="bi bi-cloud-upload-fill me-1"></i> Confirmar Registro
                    </button>
                </div>
            </form>

        </div>
    </div>

</body>
</html>
