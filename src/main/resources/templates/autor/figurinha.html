<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expedição Dinossauros | Catálogo de Figurinhas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    
    <style>
        body {
            background: linear-gradient(rgba(26, 21, 17, 0.80), rgba(15, 35, 26, 0.80)), 
                        url('/img/jurassicwallpaper.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: #FAEDCD;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        h2, h4 { color: #FAEDCD; }

        .sidebar-paleo {
            background: rgba(43, 37, 31, 0.95) !important;
            border-right: 1px solid #D4A373;
            min-width: 260px;
        }

        .logo-img { width: 35px; height: 35px; margin-right: 10px; }

        .nav-paleo .nav-link {
            color: #E6E1DA !important;
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }

        .nav-paleo .nav-link i { color: #D4A373 !important; }
        .nav-paleo .nav-link:hover {
            background: rgba(212, 163, 115, 0.1) !important;
            color: #FFF !important;
        }

        .nav-paleo .nav-link.active {
            background: #D4A373 !important;
            color: #2B251F !important;
            font-weight: bold;
        }

        .nav-paleo .nav-link.active i { color: #2B251F !important; }

        .nav-logout {
            border: 1px solid #9E2A2B !important;
            border-radius: 12px !important;
            color: #FFB3B3 !important;
            margin-top: 24px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .nav-logout:hover {
            background: #9E2A2B !important;
            color: #FFFFFF !important;
        }

        .content-card {
            background: rgba(43, 37, 31, 0.7);
            border: 1px solid #D4A373;
            border-radius: 12px;
            padding: 20px;
        }

        .search-field {
            background-color: rgba(26, 21, 17, 0.8) !important;
            color: #FFFFFF !important;
            border: 1px solid #D4A373 !important;
        }
        .search-field::placeholder { color: #D4A373 !important; opacity: 0.8; }

        .table-paleo { color: #FAEDCD !important; }
        .table-paleo th { 
            color: #D4A373 !important; 
            border-bottom: 2px solid #D4A373 !important; 
            background-color: transparent !important;
        }
        .table-paleo td { color: #FAEDCD !important; background-color: transparent !important; }

        .btn-paleo-success { background-color: #1A3A2A; color: #FAEDCD; border: 1px solid #D4A373; }
        .btn-paleo-success:hover { background-color: #D4A373; color: #2B251F; }
        .btn-action-edit, .btn-action-delete { border: 1px solid #D4A373; background: transparent; color: #FAEDCD; }
        .btn-action-edit:hover, .btn-action-delete:hover { background: #D4A373; color: #2B251F; }
    </style>
</head>
<body>

    <div class="d-flex" style="min-height: 100vh;">
        <div class="sidebar-paleo p-4 d-flex flex-column">
            <div class="d-flex align-items-center mb-2">
                <img th:src="@{/img/placaptero.png}" src="/img/placaptero.png" class="logo-img" alt="Logo">
                <h4 class="text-uppercase m-0" style="color: #D4A373;">Painel Autor</h4>
            </div>
            <p class="small mb-4 text-white-50">Módulo de Gestão</p>
            
            <ul class="nav nav-pills flex-column gap-2 nav-paleo">
                <li class="nav-item">
                    <a th:href="@{/autor/dashboard}" class="nav-link">
                        <i class="bi bi-house-door-fill"></i> Início
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/autor/figurinhas}" class="nav-link active">
                        <i class="bi bi-images"></i> Figurinhas
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/autor/albuns}" class="nav-link">
                        <i class="bi bi-journal-album"></i> Álbuns
                    </a>
                </li>
            </ul>

            <a th:href="@{/sair}" class="nav-link nav-logout text-uppercase fw-bold text-center">
                <i class="bi bi-box-arrow-left"></i> Sair
            </a>
        </div>

        <div class="p-4 p-md-5 w-100">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Catálogo de Figurinhas</h2>
                <a th:href="@{/autor/figurinhas/nova}" class="btn btn-paleo-success">
                    <i class="bi bi-plus-circle-fill"></i> Nova Figurinha
                </a>
            </div>

            <div class="content-card mb-4">
                <input type="text" id="filtroFigurinha" class="form-control search-field" placeholder="Buscar dinossauro pelo nome...">
            </div>

            <div class="content-card">
                <div class="table-responsive">
                    <table class="table table-paleo align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Imagem</th>
                                <th>Nº</th>
                                <th>Nome</th>
                                <th>Pág</th>
                                <th>TAG</th>
                                <th class="text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="f : ${figurinhas}" class="linha-figurinha">
                                <td>
                                    <img th:src="@{'/img/figurinhas/' + ${f.foto}}" 
                                         style="width: 50px; height: 50px; object-fit: cover; border-radius: 8px; border: 1px solid #D4A373;" 
                                         alt="Imagem">
                                </td>
                                <td th:text="${f.numero}">#001</td>
                                <td th:text="${f.nome}">Dinossauro</td>
                                <td th:text="${f.pagina}">1</td>
                                <td><code class="text-warning" th:text="${f.tag}">TAG</code></td>
                                <td class="text-center">
                                    <a th:href="@{/autor/figurinhas/editar/{id}(id=${f.id})}" class="btn btn-sm btn-action-edit me-2"><i class="bi bi-pencil-square"></i></a>
                                    <a th:href="@{/autor/figurinhas/excluir/{id}(id=${f.id})}" class="btn btn-sm btn-action-delete" onclick="return confirm('Confirmar exclusão?')"><i class="bi bi-trash3-fill"></i></a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(figurinhas)}">
                                <td colspan="6" class="text-center text-white-50 small py-4">Nenhuma figurinha catalogada até o momento.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('filtroFigurinha').addEventListener('input', function(e) {
            const termo = e.target.value.toLowerCase();
            document.querySelectorAll('.linha-figurinha').forEach(linha => {
                linha.style.display = linha.textContent.toLowerCase().includes(termo) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
