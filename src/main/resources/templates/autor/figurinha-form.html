<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expedição Dinossauros | Registro de Descoberta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    
    <style>
        body {
            background: linear-gradient(rgba(26, 21, 17, 0.85), rgba(15, 35, 26, 0.9)), 
                        url('/img/explorer.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #FAEDCD;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-card {
            background: rgba(43, 37, 31, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 163, 115, 0.3);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 550px;
        }

        .bg-dark-paleo {
            background-color: #2B251F !important;
            color: #FFFFFF !important;
            border: 1px solid #D4A373 !important;
        }
        
        .bg-dark-paleo::placeholder { color: #D4A373 !important; opacity: 0.8 !important; }
        
        .bg-dark-paleo:focus {
            background-color: #1A3A2A !important;
            color: #FFFFFF !important;
            border-color: #FAEDCD !important;
            box-shadow: 0 0 10px rgba(212, 163, 115, 0.4);
        }

        .select-paleo-custom {
            background-color: #2B251F !important;
            color: #FAEDCD !important;
            border: 1px solid #D4A373 !important;
        }
        .select-paleo-custom:focus {
            background-color: #2B251F !important;
            color: #FAEDCD !important;
            border-color: #FAEDCD !important;
            box-shadow: 0 0 10px rgba(212, 163, 115, 0.4);
        }
        .select-paleo-custom option {
            background-color: #2B251F !important;
            color: #FAEDCD !important;
        }

        .btn-custom-primary { background-color: #D4A373; color: #2B251F; font-weight: bold; border: none; }
        .btn-custom-primary:hover { background-color: #FAEDCD; color: #1A3A2A; }

        .btn-custom-cancel { background: transparent; color: #E6E1DA; border: 1px solid rgba(230, 225, 218, 0.4); }
        .btn-custom-cancel:hover { background: rgba(158, 42, 43, 0.3); color: #ffffff; border-color: #9E2A2B; }

        .header-img { width: 90px; margin-bottom: 15px; }

        .preview-container {
            border: 2px dashed rgba(212, 163, 115, 0.4);
            border-radius: 12px;
            padding: 15px;
            background: rgba(26, 21, 17, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 180px;
        }

        .figurinha-preview {
            max-width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #D4A373;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <div class="container p-3 d-flex justify-content-center">
        <div class="glass-card p-4 p-md-5">
            
            <div class="text-center mb-4">
                <img th:src="@{/img/placapara.png}" src="/img/placapara.png" class="header-img" alt="Logo">
                <h3 class="text-uppercase fw-bold m-0" style="color: #FAEDCD;" 
                    th:text="${figurinha.id == null ? 'Nova Descoberta' : 'Editar Registro'}">Nova Descoberta</h3>
                <p class="text-white-50 small">Registrar nova figurinha no inventário.</p>
            </div>
            
            <form th:action="@{/autor/figurinhas/salvar}" th:object="${figurinha}" method="POST" enctype="multipart/form-data">
                
                <input type="hidden" th:field="*{id}">
                
                <div class="mb-3">
                    <label class="form-label fw-bold small text-uppercase" style="color: #D4A373;">Nome do Espécime</label>
                    <input type="text" th:field="*{nome}" class="form-control bg-dark-paleo" required placeholder="Ex: Triceratops">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold small text-uppercase" style="color: #D4A373;">Numeração</label>
                        <input type="number" id="inputNumero" th:field="*{numero}" class="form-control bg-dark-paleo" required placeholder="001" min="0" max="100">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold small text-uppercase" style="color: #D4A373;">Página</label>
                        <input type="number" id="inputPagina" th:field="*{pagina}" class="form-control bg-dark-paleo" required placeholder="01" min="1">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small text-uppercase" style="color: #D4A373;">Tag / Código</label>
                    <div class="input-group">
                        <input type="text" id="inputTag" th:field="*{tag}" class="form-control bg-dark-paleo" required placeholder="Ex: DIN-001">
                        <span class="input-group-text bg-dark-paleo" style="border-left: none;"><i id="statusIcon" class="bi bi-search text-warning"></i></span>
                    </div>
                    <small class="text-white-50 d-block mt-1">Ao digitar uma TAG válida, o verso será carregado automaticamente.</small>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small text-uppercase" style="color: #D4A373;">Verso da Figurinha (Descrição / Curiosidades)</label>
                    <textarea id="txtDescricao" th:field="*{descricao}" class="form-control bg-dark-paleo" rows="3" placeholder="Insira dados fósseis, peso, altura ou curiosidades do dinossauro..."></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small text-uppercase" style="color: #D4A373;">Álbum Pertencente</label>
                    <select id="albumId" name="albumId" class="form-select select-paleo-custom" required>
                        <option value="">Selecione o Álbum...</option>
                        <option th:each="a : ${albuns}" 
                                th:value="${a.id}" 
                                th:text="${a.nome}"
                                th:data-paginas="${a.quantidadePaginas}"
                                th:selected="${figurinha.album != null && a.id == figurinha.album.id}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small text-uppercase" style="color: #D4A373;">Foto do Espécime</label>
                    <input type="file" id="inputFoto" name="file" class="form-control bg-dark-paleo" accept="image/*">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold small text-uppercase" style="color: #D4A373;">Pré-visualização do Cromo</label>
                    <div class="preview-container text-center">
                        <img id="visualizacao" 
                             th:src="${figurinha.foto != null} ? @{'/img/figurinhas/' + ${figurinha.foto}} : ''" 
                             th:style="${figurinha.foto != null} ? 'display: block;' : 'display: none;'"
                             class="figurinha-preview" alt="Pré-visualização">
                        
                        <div id="textoAuxiliar" th:style="${figurinha.foto != null} ? 'display: none;' : 'display: block;'">
                            <i class="bi bi-image text-white-50" style="font-size: 2.5rem;"></i>
                            <p class="text-white-50 small m-0 mt-2">Nenhum arquivo carregado para este espécime</p>
                        </div>
                    </div>
                </div>
                
                <div class="d-flex justify-content-end gap-3 mt-4">
                    <a th:href="@{/autor/figurinhas}" class="btn btn-custom-cancel px-4 py-2 rounded-3 text-uppercase small fw-bold">Abortar</a>
                    <button type="submit" class="btn btn-custom-primary px-4 py-2 rounded-3 text-uppercase small">
                        <i class="bi bi-save-fill me-1"></i> Confirmar Registro
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        
        document.getElementById('inputFoto').addEventListener('change', function(event) {
            const arquivo = event.target.files[0];
            const imgElement = document.getElementById('visualizacao');
            const txtAuxiliar = document.getElementById('textoAuxiliar');

            if (arquivo) {
                const leitor = new FileReader();
                leitor.onload = function(e) {
                    imgElement.src = e.target.result;
                    imgElement.style.display = 'block';
                    txtAuxiliar.style.display = 'none';
                };
                leitor.readAsDataURL(arquivo);
            } else {
                if (!imgElement.getAttribute('src').includes('/img/figurinhas/')) {
                    imgElement.style.display = 'none';
                    imgElement.src = '';
                    txtAuxiliar.style.display = 'block';
                }
            }
        });

        
        function executarBuscaPorTag() {
            const inputTag = document.getElementById('inputTag');
            const txtDescricao = document.getElementById('txtDescricao');
            const statusIcon = document.getElementById('statusIcon');
            const tagValor = inputTag.value;

            if (!tagValor.trim()) return;

            statusIcon.className = "bi bi-arrow-repeat text-info";

            fetch(`/autor/figurinhas/buscar-descricao?tag=${encodeURIComponent(tagValor)}`)
                .then(response => response.json())
                .then(dados => {
                    if (dados.sucesso === "true") {
                        
                        if (!txtDescricao.value.trim()) {
                            txtDescricao.value = dados.descricao;
                        }
                        statusIcon.className = "bi bi-check-circle-fill text-success";
                    } else {
                        statusIcon.className = "bi bi-exclamation-circle-fill text-warning";
                    }
                })
                .catch(erro => {
                    console.error("Erro ao buscar descrição base:", erro);
                    statusIcon.className = "bi bi-x-circle-fill text-danger";
                });
        }

        
        document.getElementById('inputTag').addEventListener('change', executarBuscaPorTag);

        
        const selectAlbum = document.getElementById('albumId');
        const inputPagina = document.getElementById('inputPagina');

        function atualizarLimitePaginas() {
            const opcaoSelecionada = selectAlbum.options[selectAlbum.selectedIndex];
            const maxPaginas = opcaoSelecionada.getAttribute('data-paginas');
            
            if (maxPaginas) {
                inputPagina.max = maxPaginas;
                if (parseInt(inputPagina.value) > parseInt(maxPaginas)) {
                    inputPagina.value = maxPaginas;
                }
            } else {
                inputPagina.removeAttribute('max');
            }
        }

        selectAlbum.addEventListener('change', atualizarLimitePaginas);

        
        document.addEventListener("DOMContentLoaded", function() {
            const inputTag = document.getElementById('inputTag');
            if (inputTag && inputTag.value.trim() !== "") {
                executarBuscaPorTag();
            }
        
            atualizarLimitePaginas();
        });
    </script>
</body>
</html>
