<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Central de Segurança</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/global.css">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        
        .login-bg { 
            background: linear-gradient(rgba(15, 35, 26, 0.8), rgba(15, 35, 26, 0.9)), 
                        url('/img/explorer.png');
            background-size: cover;
            background-position: center;
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }

        
        .glass-card-login {
            background: rgba(43, 37, 31, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 163, 115, 0.2);
            border-radius: 24px;
            padding: 2.5rem;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        
        .login-logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            border-radius: 50%;
            border: 2px solid rgba(212, 163, 115, 0.4);
            background-color: #000000;
            padding: 4px;
            box-shadow: 0 0 15px rgba(212, 163, 115, 0.3);
            transition: transform 0.3s ease;
        }
        .login-logo:hover {
            transform: scale(1.05) rotate(5deg);
        }

        
        .custom-input {
            background-color: rgba(20, 20, 20, 0.6) !important;
            border: 1px solid rgba(212, 163, 115, 0.3) !important;
            color: #ffffff !important;
            transition: all 0.3s;
        }
        .custom-input:focus {
            border-color: #D4A373 !important;
            box-shadow: 0 0 10px rgba(212, 163, 115, 0.3) !important;
        }

        
        .custom-input::placeholder {
            color: #D4A373 !important;
            opacity: 0.75 !important; 
        }

        .custom-input-group-text {
            background-color: rgba(10, 10, 10, 0.8) !important;
            border: 1px solid rgba(212, 163, 115, 0.3) !important;
            color: #D4A373 !important;
        }

        
        .btn-access {
            background-color: #e68b31;
            border: none;
            color: #2B251F;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        .btn-access:hover {
            background-color: #FAEDCD;
            color: #1A3A2A;
            box-shadow: 0 0 15px rgba(250, 237, 205, 0.4);
            transform: translateY(-1px);
        }

        
        .login-link {
            color: #FAEDCD;
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.2s;
        }
        .login-link:hover {
            color: #D4A373;
            text-decoration: underline;
        }

        .btn-custom-primary {
            background-color: #D4A373;
            color: #2B251F;
            font-weight: bold;
            border: none;
            transition: all 0.3s;
        }
        .btn-custom-primary:hover {
            background-color: #FAEDCD;
            color: #1A3A2A;
            box-shadow: 0 0 15px rgba(250, 237, 205, 0.4);
        }

        .btn-custom-secundary {
            background-color: #73d483;
            color: #2B251F;
            font-weight: bold;
            border: none;
            transition: all 0.3s;
        }
        .btn-custom-secundary:hover {
            background-color: #c5daca;
            color: #1A3A2A;
            box-shadow: 0 0 15px rgba(250, 237, 205, 0.4);
        }

        .custom-navbar {
            background: rgba(26, 58, 42, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(212, 163, 115, 0.2);
        }
    </style>
</head>
<body>

     <nav class="navbar navbar-expand-lg navbar-dark custom-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-uppercase" href="#" style="color: #FAEDCD; letter-spacing: 1px;">
                🦖 Expedição Dinossauros
            </a>
            <div class="justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center gap-2 flex-row">
                    <li class="nav-item ms-2">
                        <a class="btn btn-custom-primary btn-sm px-3 rounded-pill" th:href="@{/home}">
                            HOME
                        </a>
                    </li >
                    <li class="nav-item ms-2">
                        <a class="btn btn-custom-secundary btn-sm px-3 rounded-pill" th:href="@{/sobre}">
                            SOBRE
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="login-bg">
        <div class="glass-card-login text-light">
            
            <div class="text-center mb-4">
                <img src="/img/LOGOT-REX.png" class="login-logo mb-2" alt="Logo T-Rex">
                <h3 class="text-uppercase fw-bold m-0" style="color: #FAEDCD; letter-spacing: 1.5px; font-size: 1.5rem;">
                    Portal Paleo
                </h3>
                <small class="text-white-50" style="font-size: 0.75rem; letter-spacing: 1px;">SISTEMA DE SEGURANÇA INTERNA</small>
            </div>
            
            <form th:action="@{/login}" method="POST">
    
                <div th:if="${erro}" class="alert alert-danger p-2 text-center small mb-3 border-0 rounded-3" 
                    style="background-color: rgba(220, 53, 69, 0.2); color: #ea868f; border: 1px solid rgba(220, 53, 69, 0.4) !important;">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i> 
                    <span th:text="${erro}">Mensagem de erro</span>
                </div>
                
                <div class="mb-3">
                    <label class="form-label small text-white-50"><i class="bi bi-terminal me-1"></i> Credencial do Ranger</label>
                    <div class="input-group">
                        <span class="input-group-text custom-input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="login" class="form-control custom-input" placeholder="Ex: ranger_grant" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label small text-white-50"><i class="bi bi-shield-lock me-1"></i> Chave de Criptografia</label>
                    <div class="input-group">
                        <span class="input-group-text custom-input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" name="senha" class="form-control custom-input" placeholder="••••••••" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-access w-100 py-2 rounded-pill text-uppercase">
                    Acessar Painel <i class="bi bi-box-arrow-in-right ms-1"></i>
                </button>
                                
            </form>
            
        </div>
    </div>

</body>
</html>
